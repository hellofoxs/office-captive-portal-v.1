<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Wi-Fi — Login</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <a class="header__brand" href="login.html">
        <img src="assets/logo.svg" alt="Office Wi-Fi logo" />
        <span>Office Wi-Fi</span>
      </a>
      <span class="header__divider"></span>
      <span class="header__label">Network Portal</span>
    </div>
  </header>

  <!-- PAGE -->
  <main class="page">
    <div class="stack" style="max-width: 420px; width: 100%;">

      <!-- Logo + intro -->
      <div class="stack stack--sm text-center" style="align-items: center;">
        <div class="logo logo--lg">
          <img src="assets/logo.svg" alt="Office Wi-Fi logo" />
        </div>
        <div class="stack" style="gap: var(--space-xs); align-items: center;">
          <h1 class="heading heading--lg">Welcome back</h1>
          <p class="text">Connect your device to the office network.</p>
        </div>
      </div>

      <!-- Login card -->
      <div class="card">
        <div class="card-body">
          <!-- Alert (hidden by default) -->
          <div class="alert alert--danger hidden" id="login-alert" role="alert" aria-live="polite"></div>

          <form class="form" id="login-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control form-control--with-action"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="input-action"
                  data-toggle="password"
                  data-target="password"
                  aria-label="Show password"
                >
                  <svg class="icon-eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="icon-eye-closed hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="button button-primary button--block" id="login-button">
                Login
              </button>
            </div>
          </form>

          <div class="form-footer">
            <a href="#" class="button button-plain">Need help?</a>
          </div>
        </div>
      </div>

      <!-- Subtext -->
      <p class="text text--sm text-center text-subtle">Office Wi-Fi Network</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p class="footer__text">Office Wi-Fi Network — Secure Connection Portal</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
